<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MF LP replacement images 2026-08-28</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
    body { margin: 0; color: #122936; background: #f3f6f6; }
    header { padding: 28px 24px 20px; background: #fff; border-bottom: 1px solid #d6e2e3; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 700; }
    p { margin: 0; color: #557078; font-size: 14px; line-height: 1.6; }
    main { max-width: 1480px; margin: 0 auto; padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .pair { overflow: hidden; background: #fff; border: 1px solid #d6e2e3; border-radius: 8px; }
    .pair h2 { margin: 0; padding: 14px 16px 4px; font-size: 16px; }
    .pair p { padding: 0 16px 12px; }
    .images { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: #d6e2e3; }
    figure { margin: 0; min-width: 0; background: #fff; }
    figcaption { padding: 9px 12px; overflow-wrap: anywhere; font-size: 12px; color: #557078; }
    img { display: block; width: 100%; height: 260px; object-fit: contain; background: #edf2f2; }
    a { color: #167f93; }
    @media (max-width: 760px) {
      main { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
      img { height: 230px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>MF LP replacement images</h1>
    <p>同じIDの女性・男性素材を横並びで確認できます。FVは文字・CTA・バッジを含まない写真レイヤーです。</p>
  </header>
  <main>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    const pairs = [
      ["FV-D", "Desktop FV photo layer", "fv-desktop-photo-female-20260828.png", "fv-desktop-photo-male-v2-20260828.png"],
      ["FV-M", "Mobile FV photo layer", "fv-mobile-photo-female-20260828.png", "fv-mobile-photo-male-v2-20260828.png"],
      ["C01", "Initial consultation", "c01-consultation-female-20260828.png", "c01-consultation-male-v2-20260828.png"],
      ["C02", "Power Plate exercise", "c02-powerplate-female-20260828.png", "c02-powerplate-male-v2-20260828.png"],
      ["P01", "Health numbers and documents", "p01-health-numbers-female-20260828.png", "p01-health-numbers-male-v2-20260828.png"],
      ["P02", "Exercise anxiety", "p02-exercise-anxiety-female-20260828.png", "p02-exercise-anxiety-male-v2-20260828.png"],
      ["P03", "Continuity and refreshment", "p03-continuity-female-20260828.png", "p03-continuity-male-v2-20260828.png"],
      ["A01", "Counseling", "a01-counseling-female-20260828.png", "a01-counseling-male-v2-20260828.png"],
      ["V01", "Ongoing support", "v01-ongoing-support-female-20260828.png", "v01-ongoing-support-male-v2-20260828.png"],
      ["V02", "Program planning", "v02-program-planning-female-20260828.png", "v02-program-planning-male-v2-20260828.png"],
      ["R01", "Assessment", "r01-assessment-female-20260828.png", "r01-assessment-male-v2-20260828.png"],
      ["R02", "Power Plate feature", "r02-powerplate-female-20260828.png", "r02-powerplate-male-v2-20260828.png"],
      ["R03", "Document support", "r03-documents-female-20260828.png", "r03-documents-male-v2-20260828.png"],
      ["R04", "Long-term plan", "r04-long-term-female-20260828.png", "r04-long-term-male-v2-20260828.png"],
      ["D01", "Medical expense deduction", "d01-deduction-documents-female-20260828.png", "d01-deduction-documents-male-v2-20260828.png"],
      ["PR02", "Pilates support", "pr02-pilates-support-female-20260828.png", "pr02-pilates-support-male-v2-20260828.png"],
      ["PR04", "Power Plate guidance", "pr04-powerplate-guidance-female-20260828.png", "pr04-powerplate-guidance-male-v2-20260828.png"],
      ["M01", "Lat pulldown guidance", "m01-latpulldown-female-20260828.png", "m01-latpulldown-male-v2-20260828.png"],
      ["H01", "CTA background", "h01-cta-background-female-20260828.png", "h01-cta-background-male-v2-20260828.png"],
      ["FT01", "Footer contact background", "ft01-footer-contact-female-20260828.png", "ft01-footer-contact-male-v2-20260828.png"]
    ];
    const grid = document.getElementById("grid");
    for (const [id, label, female, male] of pairs) {
      const card = document.createElement("article");
      card.className = "pair";
      card.innerHTML = `
        <h2>${id} - ${label}</h2>
        <p>女性 / 男性</p>
        <div class="images">
          <figure><a href="${female}"><img loading="lazy" src="${female}" alt="${id} female"></a><figcaption>${female}</figcaption></figure>
          <figure><a href="${male}"><img loading="lazy" src="${male}" alt="${id} male"></a><figcaption>${male}</figcaption></figure>
        </div>`;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
