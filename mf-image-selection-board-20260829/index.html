<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12242a">
    <title>MF画像セレクションボード</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="heading-block">
          <p class="eyebrow">FRACTAL MEDICAL FITNESS</p>
          <h1>画像セレクションボード</h1>
          <p id="assetTotal" class="header-meta">2026.08.28 LP関連素材 / 版比較 / 全98点</p>
        </div>
        <div class="header-actions">
          <label class="reviewer-field" for="reviewerName">
            <span>確認者名</span>
            <input id="reviewerName" type="text" maxlength="30" placeholder="任意">
          </label>
          <button id="copyShareLink" class="button button-primary" type="button">
            <span class="button-icon" aria-hidden="true">↗</span>
            共有リンクをコピー
          </button>
        </div>
      </div>
    </header>

    <main class="page-content">
      <section class="selection-panel" aria-live="polite">
        <div class="selection-head">
          <div class="selection-total">
            <span class="selection-label">選択中</span>
            <strong id="selectedCount">0 / 40</strong>
          </div>
          <div class="panel-actions">
            <button id="selectVisible" class="button button-secondary" type="button">表示中を全選択</button>
            <button id="clearSelection" class="button button-quiet" type="button">選択を解除</button>
          </div>
        </div>
        <div id="selectedSummary" class="selected-summary">
          <p class="empty-summary">画像を選ぶと、ここに選択内容が表示されます。</p>
        </div>
      </section>

      <section class="catalog-controls" aria-label="画像の絞り込み">
        <div class="control-row">
          <label class="search-field" for="searchInput">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <span class="sr-only">画像を検索</span>
            <input id="searchInput" type="search" placeholder="画像名・用途で検索">
          </label>
          <p id="visibleCount" class="visible-count">表示中 40点</p>
        </div>
        <div id="filterTabs" class="filter-tabs" role="tablist" aria-label="表示フィルター"></div>
      </section>

      <section id="assetGrid" class="asset-grid" aria-label="画像素材一覧"></section>
      <p id="noResults" class="no-results" hidden>条件に一致する画像がありません。</p>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
